name: Deployment
on:
  push:
    branches:
      - main
      - dev
env:
  MONGODB_DB_NAME: gha-demo
jobs:
  test:
    env:
      MONGODB_CLUSTER_ADDRESS: my_address
      MONGODB_USERNAME: 12345678
      MONGODB_PASSWORD: abcdefgh
      PORT: 8080
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT
      - name: Run tests
        run: npm test
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information # MONGODB_USERNAME - This will not work because the environment variables defined in the test job are not available in the deploy job. # 2.MONGODB_DB_NAME - This will work because the environment variable MONGODB_DB_NAME is defined at the workflow level, making it available to all jobs in the workflow.
        run: |        
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"  
          echo "MONGODB_DB_NAME: $MONGODB_DB_NAME" 